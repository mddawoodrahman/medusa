apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medusa-app
  namespace: medusa
  annotations:
    kubernetes.io/ingress.class: azure-application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: medusa-ssl-cert
spec:
  ingressClassName: azure-application-gateway
  tls:
    - hosts:
        - medusa.example.com
      secretName: medusa-tls
  rules:
    - host: medusa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medusa-app
                port:
                  number: 80
