apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medusa-app
  namespace: medusa
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: medusa-managed-cert
    kubernetes.io/ingress.global-static-ip-name: medusa-static-ip
spec:
  ingressClassName: gce
  tls:
    - hosts:
        - medusa.example.com
      secretName: medusa-tls
  rules:
    - host: medusa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medusa-app
                port:
                  number: 80
