apiVersion: v1
kind: Secret
metadata:
  name: medusa-secrets
  namespace: medusa
  labels:
    app.kubernetes.io/name: medusa
    app.kubernetes.io/component: app
type: Opaque
stringData:
  # Required Appwrite configuration
  NEXT_PUBLIC_APPWRITE_ENDPOINT: "https://cloud.appwrite.io/v1"
  NEXT_PUBLIC_APPWRITE_PROJECT: "replace-with-appwrite-project-id"
  NEXT_PUBLIC_APPWRITE_DATABASE: "replace-with-appwrite-database-id"
  NEXT_PUBLIC_APPWRITE_USERS_COLLECTION: "replace-with-users-collection-id"
  NEXT_PUBLIC_APPWRITE_FILES_COLLECTION: "replace-with-files-collection-id"
  NEXT_PUBLIC_APPWRITE_FILE_SHARES_COLLECTION: "replace-with-file-shares-collection-id"
  NEXT_PUBLIC_APPWRITE_BUCKET: "replace-with-bucket-id"
  NEXT_APPWRITE_KEY: "replace-with-appwrite-api-key"

  # Required Clerk configuration
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "replace-with-clerk-publishable-key"
  CLERK_SECRET_KEY: "replace-with-clerk-secret-key"

  # Optional base URL values (recommended for absolute URL generation)
  NEXT_PUBLIC_APP_URL: "https://your-medusa-domain.example"
  APP_BASE_URL: "https://your-medusa-domain.example"

  # Optional: set empty to keep startup health endpoint open for probes.
  # If you set this value, update probes to include x-startup-health-token.
  STARTUP_HEALTH_TOKEN: ""
