name: Build Push Deploy Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud provider
        required: true
        default: eks
        type: choice
        options:
          - eks
          - gke
          - aks
      deploy:
        description: Deploy after image push
        required: true
        default: true
        type: boolean

env:
  IMAGE_NAME: mddawoodrahman/medusa
  NAMESPACE: medusa

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA::12}
          IMAGE_REF=${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          echo image_tag=${IMAGE_TAG} >> "$GITHUB_OUTPUT"
          echo image_ref=${IMAGE_REF} >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.ENABLE_K8S_DEPLOY == 'true')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve cloud target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo cloud=${{ inputs.cloud }} >> "$GITHUB_OUTPUT"
          else
            if [ -n "${{ vars.K8S_CLOUD }}" ]; then
              echo cloud=${{ vars.K8S_CLOUD }} >> "$GITHUB_OUTPUT"
            else
              echo cloud=eks >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate cloud target
        run: |
          case "${{ steps.target.outputs.cloud }}" in
            eks|gke|aks) echo "cloud target is valid" ;;
            *) echo "Invalid cloud target: ${{ steps.target.outputs.cloud }}"; exit 1 ;;
          esac

      - name: Configure AWS credentials
        if: steps.target.outputs.cloud == 'eks'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl for EKS
        if: steps.target.outputs.cloud == 'eks'
        run: |
          aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Authenticate to Google Cloud
        if: steps.target.outputs.cloud == 'gke'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure kubectl for GKE
        if: steps.target.outputs.cloud == 'gke'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Login to Azure
        if: steps.target.outputs.cloud == 'aks'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure kubectl for AKS
        if: steps.target.outputs.cloud == 'aks'
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply runtime secrets
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT }}
          NEXT_PUBLIC_APPWRITE_DATABASE: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE }}
          NEXT_PUBLIC_APPWRITE_USERS_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_USERS_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_FILES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_FILES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_FILE_SHARES_COLLECTION: ${{ secrets.NEXT_PUBLIC_APPWRITE_FILE_SHARES_COLLECTION }}
          NEXT_PUBLIC_APPWRITE_BUCKET: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET }}
          NEXT_APPWRITE_KEY: ${{ secrets.NEXT_APPWRITE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STARTUP_HEALTH_TOKEN: ${{ secrets.STARTUP_HEALTH_TOKEN }}
        run: |
          kubectl -n ${{ env.NAMESPACE }} create secret generic medusa-secrets \
            --from-literal=NEXT_PUBLIC_APPWRITE_ENDPOINT="$NEXT_PUBLIC_APPWRITE_ENDPOINT" \
            --from-literal=NEXT_PUBLIC_APPWRITE_PROJECT="$NEXT_PUBLIC_APPWRITE_PROJECT" \
            --from-literal=NEXT_PUBLIC_APPWRITE_DATABASE="$NEXT_PUBLIC_APPWRITE_DATABASE" \
            --from-literal=NEXT_PUBLIC_APPWRITE_USERS_COLLECTION="$NEXT_PUBLIC_APPWRITE_USERS_COLLECTION" \
            --from-literal=NEXT_PUBLIC_APPWRITE_FILES_COLLECTION="$NEXT_PUBLIC_APPWRITE_FILES_COLLECTION" \
            --from-literal=NEXT_PUBLIC_APPWRITE_FILE_SHARES_COLLECTION="$NEXT_PUBLIC_APPWRITE_FILE_SHARES_COLLECTION" \
            --from-literal=NEXT_PUBLIC_APPWRITE_BUCKET="$NEXT_PUBLIC_APPWRITE_BUCKET" \
            --from-literal=NEXT_APPWRITE_KEY="$NEXT_APPWRITE_KEY" \
            --from-literal=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --from-literal=CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            --from-literal=NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --from-literal=APP_BASE_URL="$APP_BASE_URL" \
            --from-literal=STARTUP_HEALTH_TOKEN="$STARTUP_HEALTH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Select overlay
        id: overlay
        run: echo overlay=k8s/overlays/${{ steps.target.outputs.cloud }} >> "$GITHUB_OUTPUT"

      - name: Deploy manifests
        run: kubectl apply -k "${{ steps.overlay.outputs.overlay }}"

      - name: Update app image
        run: |
          kubectl -n ${{ env.NAMESPACE }} set image deploy/medusa-app medusa=${{ needs.build-and-push.outputs.image_ref }}
          kubectl -n ${{ env.NAMESPACE }} rollout status deploy/medusa-app --timeout=300s

      - name: Post-deploy checks
        run: |
          kubectl -n ${{ env.NAMESPACE }} get pods
          kubectl -n ${{ env.NAMESPACE }} get svc
          kubectl -n ${{ env.NAMESPACE }} get ingress
